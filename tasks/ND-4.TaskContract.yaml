apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: ND-4
  title: "A baseline"
spec:
  goal: The repository is an Orun baseline — a card and a build document that take a new docs site from nothing to live on stage and prod, branded as its own, with gates that prove it offline, including the site built in the job tree orun stages
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - README.md
    - .baseline/**
    - tooling/rebrand/**
    - tooling/bootstrap/**
    - hooks/**
    - testing/**
    - docs/phases/**
    - ai/context/**
    - .github/workflows/**
    - intent.yaml
    - infra/.gitkeep
    - packages/.gitkeep
    - apps/web/**
    - tests/web/**
    - specs/**
    - tasks/**
  doneWhen:
    - orun (the bootstrap floor and the lane pin) reads repo-blueprint.yaml, and the card agrees with it
    - the leak gate, the offline bootstrap and the end-to-end tier are green in Baseline CI, the end-to-end build running on Turbopack in a staged job tree and shipping its own Pagefind index
    - no shipped workflow but ci.yml runs on a push to main, and the site's composition pin installs inside the job's tree (stack-tectonic 0.19.0)
    - the as-built status records the departures and what is not yet proven live
  gates:
    - checks
