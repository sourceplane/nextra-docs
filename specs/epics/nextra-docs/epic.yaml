# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (ND → ND-1, ND-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: nextra-docs
  key: ND
spec:
  title: "Vercel's Nextra Docs Starter Kit on Cloudflare Workers"
  summary: "The Vercel Nextra Docs Starter Kit — five MDX pages, a sidebar ordered by `_meta`, a navbar with an About page and an external Contact link, an interactive counter component, full-text search — runs equivalent in content and function on Cloudflare Workers + Static Assets through @opennextjs/cloudflare, inside the Cirrus baseline's repository conventions (Orun intent and components, credential-free checks, a gated Orun CI, one epic per repository). The upstream is Nextra 2 on Next 13's pages router, which the OpenNext adapter cannot build, so the port moves the same content to Nextra 4 on the App Router with Pagefind as the search index."
  state: started
  milestones:
    - name: "ND0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [ND-1]
    - name: "ND1 — the docs on Workers"
      exitCriteria:
        - "apps/web is the upstream content on Nextra 4, built by `next build` + Pagefind + `opennextjs-cloudflare build`"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves every page, a 404 for unknown paths and the Pagefind index from the OpenNext worker"
      tasks: [ND-2]
    - name: "ND2 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it through Orun"
        - "the as-built status records every departure from the upstream template"
      tasks: [ND-3]
    - name: "ND3 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new docs site from nothing to live on stage and prod in three phases"
        - "a site built from it carries the site only, renamed throughout to its own name, repository and Worker, through one seam (apps/web/app/site.ts)"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier — the site built on Turbopack in a staged job tree, its own Pagefind index shipped, served and smoke-tested"
      tasks: [ND-4]
    - name: "ND4 — one landing"
      exitCriteria:
        - "repo-blueprint.yaml builds the site in one landing (`01-product`) and records it in a second (`03-docs`); the card's programme names the same two"
        - "a bootstrap landing is checked by `plan` alone: ci.yml skips the lanes and checks.yml its job on `orun/BASE-…` branches"
        - "Baseline CI is green, and a site bootstrapped from the next tag is live faster than baseline-v1's measured 8m15s"
      tasks: [ND-5]
    - name: "ND5 — the cirrus standard"
      exitCriteria:
        - "nothing outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a site"
        - "every milestone's status row agrees with the tags"
        - "the console card reads subdomain from the Cloudflare connection (from: connection.cloudflare.workersSubdomain), as cirrus-baseline since baseline-v23"
      tasks: [ND-6, ND-7]
